name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Get the code
        run: |
          git init --quiet .
          git fetch --quiet --depth=1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD
      - name: Check that the repository holds only the allowed files
        run: |
          extra="$(git ls-files | grep -vxE \
            -e 'index\.html|style\.css|script\.js|data\.json|README\.md|LICENSE|\.gitignore|\.github/.*' \
            -e 'js/([a-z]+/)*[a-z]+\.js|locales/[a-z]+\.json|documentation/[A-Za-z_]+\.(md|pdf)' \
            -e 'assets/images/([a-z0-9]+/)*[a-z0-9_]+\.(webp|png|ico)|assets/images/icons/nodes/colour_key\.csv' \
            -e 'assets/fonts/[A-Za-z0-9-]+\.ttf' || true)"
          if [ -n "$extra" ]; then
            echo "These files are not allowed by the project's rules:"
            echo "$extra"
            exit 1
          fi
      - name: Run the tests in Chrome, in light and dark colours and at several window sizes
        run: |
          status=0
          for scheme in 1 0; do
            for size in 1920,1080 1280,800 800,1100 500,900; do
              google-chrome --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files \
                --blink-settings=preferredColorScheme=$scheme --virtual-time-budget=900000 --window-size=$size \
                --dump-dom "file://$PWD/index.html?test" > page.html 2> chrome.log || true
              summary="$(grep -o 'id="reportStatus"[^>]*>[^<]*' page.html | sed 's/.*>//')"
              if grep -q 'data-tests="passed"' page.html; then
                echo "$summary"
              else
                echo "${summary:-The tests did not finish in a window of $size pixels.}"
                grep -o 'Test [0-9]* failed\|Failed: [^<]*' page.html | sed 's/^/  /' || true
                status=1
              fi
            done
          done
          exit $status
      - name: Check that no folder holds more than 7 files, the main folder 8, apart from assets and locales
        if: always()
        run: |
          crowded="$(git ls-files | grep -vE '^(assets|locales)/' | sed -E 's#/[^/]+$##; t; s#.*#.#' | sort \
            | uniq -c | awk '$1 > ($2 == "." ? 8 : 7) { print ($2 == "." ? "the main folder" : $2) ": " $1 " files" }')"
          if [ -n "$crowded" ]; then
            echo "These folders hold too many files (7 at most, 8 in the main folder):"
            echo "$crowded"
            exit 1
          fi
